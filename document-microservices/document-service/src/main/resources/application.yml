spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://localhost:5432/document-service
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      # Hard limit enforced by Spring before the request reaches the controller.
      max-file-size: 100KB
      max-request-size: 100KB

# Directory on disk where uploaded customer files are stored.
file:
  upload-dir: ./uploads/customer-files

# Base URL of the external insurance-claims-system application used by the Feign client.
insurance-claims-system:
  url: http://localhost:8080

eureka:
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

server:
  port: 8001

logging:
  level:
    root: INFO
    com.example.document: DEBUG
